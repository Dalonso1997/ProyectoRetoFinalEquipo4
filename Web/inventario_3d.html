<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano aéreo</title>

    <style>
        body {
            margin: 0;
            outline: none;
            overflow: hidden;
            /* Evita que salgan barras de scroll */
        }

        canvas {
            display: block;
            /* Elimina espacio extra debajo del canvas */
        }

        /* Estilos para el botón de volver */
        #btn-volver {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 12px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            z-index: 1000;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
        }

        #btn-volver:hover {
            background: #45a049;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <button id="btn-volver" onclick="window.location.href = '/';">
        ⬅ Volver atrás
    </button>

    <div id="fundido"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; opacity: 0; pointer-events: none; z-index: 999;">
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        //laser
        const raycaster = new THREE.Raycaster();
        //posicion del raton
        const mouse = new THREE.Vector2();
        let objetoActual = null;

        // Escena y Fondo
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xDBDBDB);

        // Cámara
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 15);
        camera.lookAt(0, 0, 0);

        const posInicial = {
            x: camera.position.x,
            y: camera.position.y,
            z: camera.position.z
        };

        // Renderizador
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // LUCES (El "interruptor")
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -15;
        directionalLight.shadow.camera.right = 15;
        directionalLight.shadow.camera.top = 15;
        directionalLight.shadow.camera.bottom = -15;

        //suelo
        const suelo = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0x969696 })
        );
        suelo.receiveShadow = true;
        suelo.rotation.x = -Math.PI / 2;
        scene.add(suelo);

        // Mesa del centro
        const geometry = new THREE.CylinderGeometry(2.5, 2.5, 1, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0x62686E });
        const tableTop = new THREE.Mesh(geometry, material);
        tableTop.scale.set(2, 1.5, 1);
        tableTop.rotation.y = Math.PI / 2;
        tableTop.name = "mesaCentro"; // Etiqueta para ignorarla
        tableTop.castShadow = true;
        tableTop.receiveShadow = true;
        scene.add(tableTop);

        //armarioA
        const armarioA = crearArmario(10, 5, 1.5, "armarioA");
        armarioA.position.x = 9.2;
        armarioA.position.z = 5;
        armarioA.position.y = 2.5;
        armarioA.rotation.y = 4.72;
        scene.add(armarioA);

        //mesaA
        const mesaA = crearArmario(6, 0.5, 2.5, "mesaA");
        mesaA.position.x = 2;
        mesaA.position.y = 1;
        mesaA.position.z = 8.8;
        mesaA.rotation.y = 3.14;
        scene.add(mesaA);

        //mesaB (Mesa izquierda)
        const mesaB = crearArmario(16, 0.5, 2.5, "mesaB");
        mesaB.position.x = -8.5;
        mesaB.position.y = 1;
        mesaB.position.z = 0;
        mesaB.rotation.y = 1.58;
        scene.add(mesaB);

        //mesaC (Mesa fondo)
        const mesaC = crearArmario(14, 0.5, 2.5, "mesaC");
        mesaC.position.x = 0;
        mesaC.position.y = 1;
        mesaC.position.z = -10;
        scene.add(mesaC);

        // Sillas
        const sillaA = crearSilla("sillaA");
        sillaA.position.x = 3;
        sillaA.position.y = 1;
        sillaA.position.z = 2.8;

        const sillaB = crearSilla("sillaB");
        sillaB.position.x = -3;
        sillaB.position.y = 1;
        sillaB.position.z = 2.8;
        sillaB.rotation.y = 3.14;

        const sillaC = crearSilla("sillaC");
        sillaC.position.x = -3;
        sillaC.position.y = 1;
        sillaC.position.z = -1.5;
        sillaC.rotation.y = 3.14;

        const sillaD = crearSilla("sillaD");
        sillaD.position.x = 3;
        sillaD.position.y = 1;
        sillaD.position.z = -1.5;

        // Creación de equipos
        const ordenador1 = crearOrdenador("ordenador1");
        const ordenador2 = crearOrdenador("ordenador2");
        const ordenador3 = crearOrdenador("ordenador3");
        const ordenador4 = crearOrdenador("ordenador4");
        const ordenador5 = crearOrdenador("ordenador5");

        const monitor1 = crearMonitor("monitor1");
        const monitor2 = crearMonitor("monitor2");
        const monitor3 = crearMonitor("monitor3");
        const monitor4 = crearMonitor("monitor4");
        const monitor5 = crearMonitor("monitor5");

        // --- POSICIONAR EQUIPOS ENCIMA DE LAS MESAS (Altura Y = 1.25) ---

        // Equipos en Mesa B (Izquierda)
        monitor1.position.set(-8.2, 1.25, 4);
        ordenador1.position.set(-8.5, 1.75, 4.8);

        monitor2.position.set(-8.2, 1.25, 0);
        ordenador2.position.set(-8.5, 1.75, 0.8);

        monitor3.position.set(-8.2, 1.25, -4);
        ordenador3.position.set(-8.5, 1.75, -3.2);

        // Equipos en Mesa C (Fondo) - Los rotamos para que miren hacia el centro
        monitor4.rotation.y = -Math.PI / 2;
        monitor4.position.set(-3, 1.25, -9.7);
        ordenador4.rotation.y = -Math.PI / 2;
        ordenador4.position.set(-3.8, 1.75, -10);

        monitor5.rotation.y = -Math.PI / 2;
        monitor5.position.set(3, 1.25, -9.7);
        ordenador5.rotation.y = -Math.PI / 2;
        ordenador5.position.set(2.2, 1.75, -10);
        // ------------------------------------------------------------------

        scene.add(ordenador1);
        scene.add(ordenador2);
        scene.add(ordenador3);
        scene.add(ordenador4);
        scene.add(ordenador5);
        scene.add(monitor1);
        scene.add(monitor2);
        scene.add(monitor3);
        scene.add(monitor4);
        scene.add(monitor5);
        scene.add(sillaA);
        scene.add(sillaB);
        scene.add(sillaC);
        scene.add(sillaD);


        function crearOrdenador(nombre) {
            const ordenador = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.4), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            ordenador.castShadow = true;
            ordenador.receiveShadow = true;
            ordenador.name = "ignorar"; // Etiqueta para que no sea interactivo
            return ordenador;
        }

        function crearMonitor(nombre) {
            const grupoMonitor = new THREE.Group();

            const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            monitor.position.set(0, 0.5, 0); // Ajustado a la base local
            monitor.castShadow = true;
            monitor.receiveShadow = true;
            monitor.name = "ignorar"; // Etiqueta para que no sea interactivo
            grupoMonitor.add(monitor);

            const teclado = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 1), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            teclado.position.set(0.5, 0.05, 0);
            teclado.castShadow = true;
            teclado.receiveShadow = true;
            teclado.name = "ignorar";
            grupoMonitor.add(teclado);

            const raton = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.15), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            raton.position.set(0.5, 0.075, 0.7);
            raton.castShadow = true;
            raton.receiveShadow = true;
            raton.name = "ignorar";
            grupoMonitor.add(raton);

            return grupoMonitor;
        }

        function crearSilla(nombre) {
            const grupoSilla = new THREE.Group();
            const geo = new THREE.BoxGeometry(1, 0.2, 1);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x62686E,
                roughness: 0.7
            });

            const matVerde = new THREE.MeshStandardMaterial({
                color: 0x8CA44A,
                roughness: 0.7
            });

            const silla = new THREE.Mesh(geo, matVerde);
            const respaldo = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1, 1), mat);
            const pata = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), mat);
            const pata2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), mat);
            const pata3 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), mat);
            const pata4 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), mat);

            pata.position.y = -0.35;
            pata.position.x = -0.35;
            pata.position.z = 0.4;

            pata2.position.y = -0.35;
            pata2.position.x = 0.4;
            pata2.position.z = 0.4;

            pata3.position.y = -0.35;
            pata3.position.x = -0.4;
            pata3.position.z = -0.4;

            pata4.position.y = -0.35;
            pata4.position.x = 0.5;
            pata4.position.z = -0.4;

            respaldo.position.x = 0.5;
            respaldo.position.y = 0.4;

            silla.name = nombre;
            silla.castShadow = true;
            silla.receiveShadow = true;
            grupoSilla.add(pata);
            grupoSilla.add(pata2);
            grupoSilla.add(pata3);
            grupoSilla.add(pata4);
            grupoSilla.add(silla);
            grupoSilla.add(respaldo);

            return grupoSilla;
        }

        // HOVER (Mouse Move)
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);

            // Filtramos suelo, mesa central y los equipos etiquetados como "ignorar"
            if (intersects.length > 0 &&
                intersects[0].object !== suelo &&
                intersects[0].object.name !== "mesaCentro" &&
                intersects[0].object.name !== "ignorar") {

                const detectado = intersects[0].object;

                if (objetoActual !== detectado) {
                    // Si cambias rápido entre objetos, reseteamos el anterior
                    if (objetoActual) {
                        gsap.to(objetoActual.material.color, { r: 0.58, g: 0.33, b: 0.21, duration: 0.3 });
                    }
                    objetoActual = detectado;
                    gsap.to(objetoActual.material.color, { r: 0.76, g: 0.47, b: 0.31, duration: 0.3 });
                    document.body.style.cursor = 'pointer';
                }
            } else {
                if (objetoActual) {
                    // Resetear color original y cursor
                    gsap.to(objetoActual.material.color, { r: 0.58, g: 0.33, b: 0.21, duration: 0.3 });
                    objetoActual = null;
                    document.body.style.cursor = 'default';
                }
            }
        });

        //click
        window.addEventListener('click', () => {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);

            if (intersects.length > 0) {
                const obj = intersects[0].object;

                // Excluimos la mesa central, el suelo y los equipos ignorados
                if (obj !== suelo && obj.name !== "mesaCentro" && obj.name !== "ignorar") {

                    //si son mesas
                    if (obj.name === "mesaA" || obj.name === "mesaB" || obj.name === "mesaC") {
                        alert("Las mesas aun no estan disponibles.");
                        return; //cortamos ejecuccion
                    }

                    //si no es mesa enfocamos el armario
                    enfocarArmario(obj);
                }
            }
        });

        function crearArmario(ancho, alto, largo, nombre) {
            const geo = new THREE.BoxGeometry(ancho, alto, largo);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x945637,
                roughness: 0.7
            });
            const armario = new THREE.Mesh(geo, mat);
            armario.name = nombre;
            armario.castShadow = true;
            return armario;
        }

        function enfocarArmario(armarioClicado) {
            const distancia = 8;
            const offsetZ = Math.cos(armarioClicado.rotation.y) * distancia;
            const offsetX = Math.sin(armarioClicado.rotation.y) * distancia;

            // 1. Zoom de cámara
            gsap.to(camera.position, {
                x: armarioClicado.position.x + offsetX,
                y: 2,
                z: armarioClicado.position.z + offsetZ,
                duration: 1.5,
                ease: "power2.inOut",
                onUpdate: () => camera.lookAt(armarioClicado.position.x, 1, armarioClicado.position.z)
            });

            // 2. Fundido a negro y REDIRECCIÓN
            gsap.to("#fundido", {
                opacity: 1,
                duration: 0.8,
                delay: 0.7,
                onComplete: () => {
                    // Si es el armario A, saltamos al archivo index.html
                    if (armarioClicado.name === "armarioA") {
                        window.location.href = "armario.html";
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>

</html>
